    // ─────────────────────────────────────────────────────────────
    // Síntese de Efeitos Sonoros com Sirene de Fuga Ininterrupta
    // ─────────────────────────────────────────────────────────────
    class SoundFX {
      constructor() {
        this.ctx = null;
        this.sirenNodes = null;
      }

      init() {
        if (!this.ctx) {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          if (AudioContextClass) this.ctx = new AudioContextClass();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      startEmergencySiren() {
        this.init();
        if (!this.ctx) return;
        this.stopEmergencySiren();

        const ctx = this.ctx;
        const osc = ctx.createOscillator();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(750, ctx.currentTime);

        const lfo = ctx.createOscillator();
        lfo.type = 'sine';
        lfo.frequency.setValueAtTime(4.0, ctx.currentTime);

        const lfoGain = ctx.createGain();
        lfoGain.gain.setValueAtTime(320, ctx.currentTime);

        lfo.connect(lfoGain);
        lfoGain.connect(osc.frequency);

        const mainGain = ctx.createGain();
        mainGain.gain.setValueAtTime(0.28, ctx.currentTime);

        osc.connect(mainGain);
        mainGain.connect(ctx.destination);

        osc.start();
        lfo.start();

        this.sirenNodes = { osc, lfo, mainGain };
      }

      stopEmergencySiren() {
        if (this.sirenNodes && this.ctx) {
          try {
            const { osc, lfo, mainGain } = this.sirenNodes;
            mainGain.gain.linearRampToValueAtTime(0.001, this.ctx.currentTime + 0.08);
            setTimeout(() => {
              try {
                osc.stop();
                lfo.stop();
                osc.disconnect();
                lfo.disconnect();
                mainGain.disconnect();
              } catch(e) {}
            }, 100);
          } catch(e) {}
          this.sirenNodes = null;
        }
      }

      playBuzzer() {
        try {
          this.init();
          if (!this.ctx) return;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(180, this.ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(60, this.ctx.currentTime + 0.3);
          gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
          gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.3);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + 0.3);
        } catch(e) { console.warn(e); }
      }

      playClick() {
        try {
          this.init();
          if (!this.ctx) return;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(650, this.ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(250, this.ctx.currentTime + 0.05);
          gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
          gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.05);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + 0.05);
        } catch(e) { console.warn(e); }
      }

      playCelebration() {
        try {
          this.init();
          if (!this.ctx) return;
          const notes = [523.25, 659.25, 783.99, 1046.50];
          notes.forEach((freq, i) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.value = freq;
            const startTime = this.ctx.currentTime + i * 0.12;
            gain.gain.setValueAtTime(0.2, startTime);
            gain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.35);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(startTime);
            osc.stop(startTime + 0.35);
          });
        } catch(e) { console.warn(e); }
      }
    }

    const processSpriteImage = (img) => {
      const w = img.naturalWidth;
      const h = img.naturalHeight;
      const ratio = w / h;

      // 1. Grade 4x3 (como a folha oficial de 12 frames da personagem padrão: 4 colunas x 3 linhas)
      if (Math.abs(ratio - 4/3) < 0.15 || (w % 4 === 0 && h % 3 === 0 && ratio > 1.1 && ratio < 1.7)) {
        const frameW = w / 4;
        const frameH = h / 3;

        // Frame 1: Normal em pé (Linha 0, Coluna 0)
        const c1 = document.createElement('canvas');
        c1.width = frameW; c1.height = frameH;
        const ctx1 = c1.getContext('2d');
        ctx1.imageSmoothingEnabled = false;
        ctx1.drawImage(img, 0, 0, frameW, frameH, 0, 0, frameW, frameH);

        // Frame 2: Impulso / Arrancada decolando (Linha 1, Coluna 3)
        const c2 = document.createElement('canvas');
        c2.width = frameW; c2.height = frameH;
        const ctx2 = c2.getContext('2d');
        ctx2.imageSmoothingEnabled = false;
        ctx2.drawImage(img, 3 * frameW, 1 * frameH, frameW, frameH, 0, 0, frameW, frameH);

        // Frame 3: Voo Superman horizontal no círculo (Linha 2, Coluna 0)
        const c3 = document.createElement('canvas');
        c3.width = frameW; c3.height = frameH;
        const ctx3 = c3.getContext('2d');
        ctx3.imageSmoothingEnabled = false;
        ctx3.drawImage(img, 0, 2 * frameH, frameW, frameH, 0, 0, frameW, frameH);

        return {
          customImg1: c1.toDataURL(),
          customImg2: c2.toDataURL(),
          customImg3: c3.toDataURL()
        };
      }

      // 2. Faixa horizontal 3x1 (3 quadros lado a lado)
      if (ratio >= 2.2) {
        const frameW = w / 3;
        const frameH = h;
        const frames = [];
        for (let i = 0; i < 3; i++) {
          const canvas = document.createElement('canvas');
          canvas.width = frameW; canvas.height = frameH;
          const ctx = canvas.getContext('2d');
          ctx.imageSmoothingEnabled = false;
          ctx.drawImage(img, i * frameW, 0, frameW, frameH, 0, 0, frameW, frameH);
          frames.push(canvas.toDataURL());
        }
        return {
          customImg1: frames[0],
          customImg2: frames[1],
          customImg3: frames[2]
        };
      }

      // 3. Imagem única: gera proceduralmente as 3 poses de voo
      const canvas2 = document.createElement('canvas');
      canvas2.width = 128; canvas2.height = 128;
      const ctx2 = canvas2.getContext('2d');
      ctx2.imageSmoothingEnabled = false;
      ctx2.translate(64, 64);
      ctx2.rotate((22 * Math.PI) / 180);
      ctx2.scale(0.92, 1.08);
      ctx2.drawImage(img, -54, -54, 108, 108);
      const customImg2 = canvas2.toDataURL();

      const canvas3 = document.createElement('canvas');
      canvas3.width = 128; canvas3.height = 128;
      const ctx3 = canvas3.getContext('2d');
      ctx3.imageSmoothingEnabled = false;
      ctx3.translate(64, 64);
      ctx3.rotate((55 * Math.PI) / 180);
      ctx3.transform(1.12, 0, -0.18, 0.88, 0, 0);
      ctx3.drawImage(img, -54, -54, 108, 108);
      const customImg3 = canvas3.toDataURL();

      return {
        customImg1: img.src,
        customImg2,
        customImg3
      };
    };

    // ─────────────────────────────────────────────────────────────
    // Componente Principal: App
    // ─────────────────────────────────────────────────────────────
    function App() {
      // Carregamento síncrono do estado salvo:
      // Se a página for recarregada (F5) enquanto bloqueada OU durante uma sessão ativa,
      // a tela de bloqueio é reativada instantaneamente!
      const saved = loadSavedState();
      const wasPenalizedOrReloadedDuringSession = Boolean(saved?.isPenalized || saved?.isActive);

      // Estado do Tema de Cores (Amarelo padrão)
      const [themeColor, setThemeColor] = useState(() => {
        try {
          return localStorage.getItem('focus_theme_color') || 'amarelo';
        } catch(e) {
          return 'amarelo';
        }
      });
      const currentThemeConfig = THEME_PRESETS[themeColor] || THEME_PRESETS.amarelo;

      useEffect(() => {
        try {
          localStorage.setItem('focus_theme_color', themeColor);
        } catch(e) {}
        document.body.style.backgroundColor = currentThemeConfig.bg;
      }, [themeColor, currentThemeConfig]);

      const [isActive, setIsActive] = useState(saved ? Boolean(saved.isActive) : false);
      const [isPaused, setIsPaused] = useState(saved ? Boolean(saved.isPaused) : false);
      const [isPenalized, setIsPenalized] = useState(wasPenalizedOrReloadedDuringSession);
      const [timeLeft, setTimeLeft] = useState(saved?.timeLeft ?? 25 * 60);
      const [initialDuration, setInitialDuration] = useState(saved?.initialDuration ?? 25 * 60);
      const [distractionStrikes, setDistractionStrikes] = useState(
        (saved?.distractionStrikes ?? 0) + (saved?.isActive && !saved?.isPenalized ? 1 : 0)
      );
      const [mascotMood, setMascotMood] = useState(
        wasPenalizedOrReloadedDuringSession ? 'furioso' : (saved?.isActive ? 'focado' : 'dormindo')
      );
      const [mascotMessage, setMascotMessage] = useState(
        wasPenalizedOrReloadedDuringSession
          ? "Atenção: Validação de presença obrigatória pendente. Digite a frase para prosseguir."
          : (saved?.isPaused ? "Não desista, falta só mais um pouco!" : "Estou com preguiça…Por que não fazer amanhã?")
      );
      const initialTotalSecs = saved?.timeLeft ?? 25 * 60;
      const [customHours, setCustomHours] = useState(
        Math.floor(initialTotalSecs / 3600)
      );
      const [customMinutes, setCustomMinutes] = useState(
        Math.floor((initialTotalSecs % 3600) / 60)
      );
      const [customSeconds, setCustomSeconds] = useState(
        initialTotalSecs % 60
      );
      const [distractionsList, setDistractionsList] = useState(
        saved?.distractionsList ?? ['Instagram', 'TikTok', 'Twitter / X', 'YouTube Shorts', 'Jogos']
      );
      const [newDistraction, setNewDistraction] = useState('');
      const [isRestrictionsOpen, setIsRestrictionsOpen] = useState(false);
      
      const [penaltyChallenge, setPenaltyChallenge] = useState(saved?.penaltyChallenge || PENALTY_PHRASES[0]);
      const [typedPenalty, setTypedPenalty] = useState('');
      const [penaltyTimer, setPenaltyTimer] = useState(saved?.isPenalized ? (saved?.penaltyTimer ?? 0) : 0);
      const [cheatAttempt, setCheatAttempt] = useState(false);

      const [orbitSettings, setOrbitSettings] = useState(loadOrbitSettings);
      const [showOrbitModal, setShowOrbitModal] = useState(false);
      const [orbitAnimState, setOrbitAnimState] = useState(saved?.isActive ? 3 : 1);

      useEffect(() => {
        // Tenta detectar automaticamente a folha de sprites da pasta do personagem se não houver imagem ativa
        const charId = orbitSettings.selectedCharacter || 'personagem-1-padrao';
        if (!orbitSettings.customImg1) {
          loadCharacterFromDisk(charId, (result) => {
            if (result) {
              setOrbitSettings(prev => ({
                ...prev,
                customImg1: result.customImg1,
                customImg2: result.customImg2,
                customImg3: result.customImg3
              }));
            }
          });
        }
      }, []);

      const handleUpdateOrbitSettings = (newSettings) => {
        setOrbitSettings(newSettings);
        try {
          localStorage.setItem(ORBIT_SETTINGS_KEY, JSON.stringify(newSettings));
        } catch (e) {}
      };

      const triggerOrbitTestSequence = () => {
        setOrbitAnimState(1);
        setTimeout(() => {
          setOrbitAnimState(2);
        }, 650);
        setTimeout(() => {
          setOrbitAnimState(3);
        }, 1150);
      };

      useEffect(() => {
        window.__orbit = {
          getState: () => ({ orbitAnimState, orbitSettings, isActive, isPaused }),
          setOrbitAnimState,
          openModal: () => setShowOrbitModal(true),
          closeModal: () => setShowOrbitModal(false),
          triggerTestSequence: triggerOrbitTestSequence,
          updateSettings: handleUpdateOrbitSettings
        };
      }, [orbitAnimState, orbitSettings, isActive, isPaused]);
      
      const titleIntervalRef = useRef(null);
      const initialDurationRef = useRef(initialDuration);

      useEffect(() => {
        initialDurationRef.current = initialDuration;
      }, [initialDuration]);

      // Protocolo de Presença: exibido por apenas 5 segundos ao entrar no site
      const [showPresenceProtocol, setShowPresenceProtocol] = useState(true);
      const [presenceFading, setPresenceFading] = useState(false);

      useEffect(() => {
        const fadeTimer = setTimeout(() => {
          setPresenceFading(true);
        }, 5000);

        const removeTimer = setTimeout(() => {
          setShowPresenceProtocol(false);
        }, 5600);

        return () => {
          clearTimeout(fadeTimer);
          clearTimeout(removeTimer);
        };
      }, []);

      // Persistência automática no localStorage a cada alteração crítica
      useEffect(() => {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify({
            isActive,
            isPaused,
            isPenalized,
            timeLeft,
            initialDuration,
            distractionStrikes,
            penaltyChallenge,
            penaltyTimer,
            distractionsList
          }));
        } catch (e) {}
      }, [isActive, isPaused, isPenalized, timeLeft, initialDuration, distractionStrikes, penaltyChallenge, penaltyTimer, distractionsList]);

      // Alerta nativo de navegador caso tente fechar ou recarregar durante o foco ou penalidade
      useEffect(() => {
        const handleBeforeUnload = (e) => {
          if (isActive || isPenalized) {
            e.preventDefault();
            e.returnValue = 'A sessão ainda está ativa ou sob validação pendente!';
            return e.returnValue;
          }
        };
        window.addEventListener('beforeunload', handleBeforeUnload);
        return () => window.removeEventListener('beforeunload', handleBeforeUnload);
      }, [isActive, isPenalized]);

      // Sentinela de fuga da aba
      useEffect(() => {
        const handleVisibilityChange = () => {
          if (document.hidden && isActive) {
            sound.startEmergencySiren();

            if (titleIntervalRef.current) clearInterval(titleIntervalRef.current);
            let toggle = false;
            titleIntervalRef.current = setInterval(() => {
              document.title = toggle ? "[ALERTA] Retorne à Sessão de Foco" : "[INTERROMPIDO] Foco Descontinuado";
              toggle = !toggle;
            }, 600);

            const randomTaunt = TAUNTS[Math.floor(Math.random() * TAUNTS.length)];
            const randomPhrase = PENALTY_PHRASES[Math.floor(Math.random() * PENALTY_PHRASES.length)];
            
            setDistractionStrikes(prev => prev + 1);
            setIsPenalized(true);
            setPenaltyTimer(10);
            setTypedPenalty('');
            setCheatAttempt(false);
            setPenaltyChallenge(randomPhrase);
            setMascotMood('furioso');
            setMascotMessage(`Atenção: ${randomTaunt}`);

            if ('Notification' in window && Notification.permission === 'granted') {
              new Notification('Alerta de Foco: Sessão Interrompida', {
                body: 'Sinal sonoro ativo. Retorne à aba para prosseguir com a sessão.',
                requireInteraction: true
              });
            }
          } else if (!document.hidden) {
            sound.stopEmergencySiren();
            if (titleIntervalRef.current) {
              clearInterval(titleIntervalRef.current);
              titleIntervalRef.current = null;
            }
            document.title = "Modo Foco — Gestão Comportamental Anti-Procrastinação";
          }
        };

        document.addEventListener('visibilitychange', handleVisibilityChange);
        return () => {
          document.removeEventListener('visibilitychange', handleVisibilityChange);
          sound.stopEmergencySiren();
          if (titleIntervalRef.current) clearInterval(titleIntervalRef.current);
        };
      }, [isActive]);

      // Timer da Sessão
      useEffect(() => {
        let interval = null;
        if (isActive && !isPenalized) {
          interval = setInterval(() => {
            setTimeLeft(prev => {
              if (prev <= 1) {
                clearInterval(interval);
                setIsActive(false);
                setIsPaused(false);
                setIsPenalized(false);
                setMascotMood('comemorando');
                setMascotMessage("Parabéns, nós conseguimos!");
                sound.playCelebration();
                setOrbitAnimState(1);
                try {
                  localStorage.removeItem(STORAGE_KEY);
                } catch(e) {}
                return 0;
              }
              const next = prev - 1;
              const dur = initialDurationRef.current || initialDuration;
              if (dur > 60 && next <= 60) {
                setMascotMessage(m => (m !== "Falta pouco! Não desista!" ? "Falta pouco! Não desista!" : m));
              } else if (dur >= 5 * 60 && next <= Math.ceil(dur / 2)) {
                setMascotMessage(m => (m !== "Estamos na metade do caminho, força!" ? "Estamos na metade do caminho, força!" : m));
              }
              return next;
            });
          }, 1000);
        }
        return () => clearInterval(interval);
      }, [isActive, isPenalized, initialDuration]);

      // Timer da Penitência
      useEffect(() => {
        let penaltyInterval = null;
        if (isPenalized && penaltyTimer > 0) {
          penaltyInterval = setInterval(() => {
            setPenaltyTimer(prev => Math.max(0, prev - 1));
          }, 1000);
        }
        return () => clearInterval(penaltyInterval);
      }, [isPenalized, penaltyTimer]);

      const selectPreset = (h, m, s) => {
        sound.playClick();
        setIsPaused(false);
        setCustomHours(h);
        setCustomMinutes(m);
        setCustomSeconds(s);
        const total = (h * 3600) + (m * 60) + s;
        setTimeLeft(total);
        setInitialDuration(total);
      };

      const updateTimeField = (hVal, mVal, sVal) => {
        setIsPaused(false);
        setCustomHours(hVal);
        setCustomMinutes(mVal);
        setCustomSeconds(sVal);

        const h = Math.max(0, Math.min(23, parseInt(hVal, 10) || 0));
        const m = Math.max(0, Math.min(59, parseInt(mVal, 10) || 0));
        const s = Math.max(0, Math.min(59, parseInt(sVal, 10) || 0));
        const total = (h * 3600) + (m * 60) + s;
        setTimeLeft(total);
        setInitialDuration(total);
      };

      const resetTimer = () => {
        sound.stopEmergencySiren();
        if (titleIntervalRef.current) clearInterval(titleIntervalRef.current);
        document.title = "Modo Foco — Gestão Comportamental Anti-Procrastinação";
        sound.playClick();
        setIsActive(false);
        setIsPaused(false);
        setIsPenalized(false);
        setPenaltyTimer(0);
        setTypedPenalty('');
        setCustomHours(0);
        setCustomMinutes(0);
        setCustomSeconds(0);
        setTimeLeft(0);
        setInitialDuration(0);
        setMascotMood('dormindo');
        setMascotMessage("Estou com preguiça…Por que não fazer amanhã?");
        setOrbitAnimState(1);
        try {
          localStorage.removeItem(STORAGE_KEY);
        } catch(e) {}
      };

      const handleSelectTheme = (newColor) => {
        sound.playClick();
        setThemeColor(newColor);
        resetTimer();
      };

      const startSession = (totalSeconds) => {
        sound.playClick();
        const duration = Math.max(1, totalSeconds);
        initialDurationRef.current = duration;
        setTimeLeft(duration);
        setInitialDuration(duration);
        setDistractionStrikes(0);
        setIsActive(true);
        setIsPaused(false);
        setIsPenalized(false);
        setMascotMood('focado');
        setMascotMessage("Vamos lá, a gente consegue!");

        // Sequência de ativação orbital: 1 (Normal) -> 2 (Impulso) -> 3 (Voo Superman)
        setOrbitAnimState(1);
        setTimeout(() => {
          setOrbitAnimState(2);
        }, 650);
        setTimeout(() => {
          setOrbitAnimState(3);
        }, 1150);
      };

      const resumeSession = () => {
        sound.playClick();
        setIsActive(true);
        setIsPaused(false);
        setIsPenalized(false);
        setMascotMood('focado');
        if (orbitAnimState !== 3) {
          setOrbitAnimState(3);
        }

        const dur = initialDurationRef.current || initialDuration;
        let resumeMsg = "Vamos lá, a gente consegue!";
        if (dur > 60 && timeLeft <= 60) {
          resumeMsg = "Falta pouco! Não desista!";
        } else if (dur >= 5 * 60 && timeLeft <= Math.ceil(dur / 2)) {
          resumeMsg = "Estamos na metade do caminho, força!";
        }
        setMascotMessage(resumeMsg);
      };

      const handleStartCurrentSession = () => {
        if (isPaused && timeLeft > 0) {
          resumeSession();
          return;
        }
        const h = Math.max(0, Math.min(23, parseInt(customHours, 10) || 0));
        const m = Math.max(0, Math.min(59, parseInt(customMinutes, 10) || 0));
        const s = Math.max(0, Math.min(59, parseInt(customSeconds, 10) || 0));
        const total = (h * 3600) + (m * 60) + s;
        if (total <= 0) {
          sound.playBuzzer();
          setMascotMessage("Defina um tempo maior que zero para iniciar a sessão.");
          return;
        }
        startSession(total);
      };

      const stopSession = () => {
        sound.stopEmergencySiren();
        if (titleIntervalRef.current) clearInterval(titleIntervalRef.current);
        document.title = "Modo Foco — Gestão Comportamental Anti-Procrastinação";
        sound.playClick();
        setIsActive(false);
        setIsPaused(true);
        setIsPenalized(false);
        setMascotMood('dormindo');
        setMascotMessage("Não desista, falta só mais um pouco!");

        const h = Math.floor(timeLeft / 3600);
        const m = Math.floor((timeLeft % 3600) / 60);
        const s = timeLeft % 60;
        setCustomHours(h);
        setCustomMinutes(m);
        setCustomSeconds(s);

        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify({
            isActive: false,
            isPaused: true,
            isPenalized: false,
            timeLeft,
            initialDuration: initialDurationRef.current || initialDuration,
            distractionStrikes,
            penaltyChallenge,
            penaltyTimer: 0,
            distractionsList
          }));
        } catch(e) {}
      };

      const resolvePenalty = () => {
        sound.stopEmergencySiren();
        sound.playClick();
        setIsPenalized(false);
        setPenaltyTimer(0);
        setTypedPenalty('');
        setMascotMood('focado');

        const dur = initialDurationRef.current || initialDuration;
        let resumeMsg = "Vamos lá, a gente consegue!";
        if (dur > 60 && timeLeft <= 60) {
          resumeMsg = "Falta pouco! Não desista!";
        } else if (dur >= 5 * 60 && timeLeft <= Math.ceil(dur / 2)) {
          resumeMsg = "Estamos na metade do caminho, força!";
        }
        setMascotMessage(resumeMsg);

        try {
          const current = loadSavedState() || {};
          current.isPenalized = false;
          current.penaltyTimer = 0;
          localStorage.setItem(STORAGE_KEY, JSON.stringify(current));
        } catch (e) {}
      };

      const addDistraction = (e) => {
        e.preventDefault();
        const trimmed = newDistraction.trim();
        if (trimmed && !distractionsList.includes(trimmed)) {
          sound.playClick();
          setDistractionsList([...distractionsList, trimmed]);
          setNewDistraction('');
        }
      };

      const removeDistraction = (name) => {
        if (isActive) return;
        sound.playClick();
        setDistractionsList(distractionsList.filter(item => item !== name));
      };

      const formatTime = (secs) => {
        const h = Math.floor(secs / 3600);
        const m = Math.floor((secs % 3600) / 60);
        const s = secs % 60;
        return `${h.toString().padStart(2, '0')}:${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
      };

      const progressPercent = initialDuration > 0 ? ((initialDuration - timeLeft) / initialDuration) * 100 : 0;
      const strokeDashoffset = 440 - (440 * progressPercent) / 100;

      const getMascotVisual = () => {
        switch (mascotMood) {
          case 'focado':
            return {
              isBoxing: true,
              armLeft: 'ง',
              faceCenter: '•̀_•́',
              armRight: 'ง',
              eyes: '(ง •̀_•́)ง',
              mouth: '',
              bg: currentThemeConfig.mascotFocadoBg || 'bg-amber-600',
              border: currentThemeConfig.mascotFocadoBorder || 'border-4 border-amber-900/80',
              anim: 'animate-breathe',
              balloonAnim: 'anim-balloon-breathe',
              ring: currentThemeConfig.mascotFocadoRing || 'ring-amber-500/40'
            };
          case 'furioso':
            return {
              eyes: 'ಠ益ಠ',
              mouth: '▲',
              bg: 'bg-red-600',
              anim: 'animate-shake',
              balloonAnim: 'anim-balloon-shake',
              ring: 'ring-red-600/60'
            };
          case 'comemorando':
            return {
              isWinking: true,
              eyes: '(。•̀ᴗ-)✧',
              mouth: '',
              eyesClass: 'text-2xl sm:text-3xl tracking-normal text-sky-950',
              bg: 'bg-[#7DD3FC]',
              border: 'border-4 border-sky-400',
              anim: 'animate-victory',
              balloonAnim: 'anim-balloon-victory',
              ring: 'ring-sky-300/60'
            };
          default:
            return {
              isSleeping: true,
              eyes: '(¯﹃¯)',
              mouth: '',
              eyesClass: currentThemeConfig.mascotSleepingEyes || 'text-3xl tracking-normal text-amber-950',
              mouthClass: currentThemeConfig.mascotSleepingMouth || 'text-xl text-amber-900 font-bold',
              bg: currentThemeConfig.mascotSleepingBg || 'bg-amber-300',
              border: currentThemeConfig.mascotSleepingBorder || 'border-4 border-amber-900/80',
              anim: 'anim-sleep-box',
              balloonAnim: 'anim-balloon-sleep',
              ring: currentThemeConfig.mascotSleepingRing || 'ring-amber-400/40'
            };
        }
      };
      const visual = getMascotVisual();

      const canUnlockPenalty = penaltyTimer === 0 && typedPenalty.trim().toLowerCase() === penaltyChallenge.trim().toLowerCase();

      return (
        <div className="min-h-screen flex flex-col justify-between transition-colors duration-300" style={{ backgroundColor: currentThemeConfig.bg }}>
          {/* Header Superior Alinhado aos Cantos com Seletor Central de Cores */}
          <header
            className="w-full border-b backdrop-blur-sm sticky top-0 z-40 shadow-xs transition-colors duration-300"
            style={{ backgroundColor: currentThemeConfig.headerBg, borderColor: currentThemeConfig.borderColor }}
          >
            <div className="w-full max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-2.5 sm:py-3 flex justify-between items-center gap-3 relative">
              
              {/* Canto Esquerdo: Título Modo de Foco */}
              <div className="flex items-center gap-2 sm:gap-3 shrink-0 text-left z-10">
                <div className={`w-8 h-8 sm:w-10 sm:h-10 rounded-xl flex items-center justify-center shadow-md shadow-amber-500/10 shrink-0 transition-colors ${currentThemeConfig.accentIconBg}`}>
                  <Icons.Target className={`w-4 h-4 sm:w-5 sm:h-5 ${currentThemeConfig.accentIcon}`} />
                </div>
                <div>
                  <h1 className="text-xs sm:text-base md:text-lg font-black tracking-tight text-slate-900 flex items-center gap-1.5 sm:gap-2">
                    <span className="whitespace-nowrap">MODO DE FOCO</span>
                    <span className={`hidden lg:inline-block text-[9px] sm:text-[10px] px-1.5 sm:px-2 py-0.5 rounded font-mono font-semibold whitespace-nowrap transition-colors ${currentThemeConfig.badge}`}>
                      ANTI-PROCRASTINAÇÃO
                    </span>
                  </h1>
                  <p className={`hidden lg:block text-[10px] sm:text-xs font-medium whitespace-nowrap transition-colors ${currentThemeConfig.footerText}`}>
                    Vigilância Comportamental de Produtividade
                  </p>
                </div>
              </div>

              {/* Centro (Desktop e Tablet): 5 Botões de Cores (Azul, Rosa, Amarelo, Verde, Roxo) */}
              <div className="hidden sm:flex items-center justify-center absolute left-1/2 -translate-x-1/2 z-10 pointer-events-auto">
                <ColorPaletteSelector
                  currentTheme={themeColor}
                  onSelectTheme={handleSelectTheme}
                />
              </div>

              {/* Canto Direito: Botão de Alteração (Animação) e Notificação */}
              <div className="flex items-center gap-1.5 sm:gap-2.5 shrink-0 z-10">
                <button
                  type="button"
                  onClick={() => setShowOrbitModal(true)}
                  className={`text-xs px-2.5 sm:px-3 py-1.5 rounded-lg font-bold flex items-center gap-1.5 transition-all cursor-pointer shadow-xs whitespace-nowrap ${currentThemeConfig.button}`}
                  title="Configurações e alteração da animação orbital"
                >
                  <Icons.Sliders className={`w-3.5 h-3.5 ${currentThemeConfig.accentIcon} shrink-0`} />
                  <span>Animação</span>
                </button>
                <button
                  type="button"
                  onClick={() => {
                    if ('Notification' in window) Notification.requestPermission();
                  }}
                  className={`text-xs px-2.5 sm:px-3 py-1.5 rounded-lg font-semibold flex items-center gap-1.5 transition-all cursor-pointer shadow-xs whitespace-nowrap ${currentThemeConfig.button}`}
                  title="Permissões de notificações"
                >
                  <Icons.Bell className={`w-3.5 h-3.5 ${currentThemeConfig.accentIcon} shrink-0`} />
                  <span className="hidden sm:inline">Notificações</span>
                </button>
              </div>

            </div>

            {/* Linha Centralizada para Celular (Mobile): 5 Botões de Cores com Toque Amplo e Sem Colisão */}
            <div className="flex sm:hidden justify-center items-center pb-2.5 pt-0.5 px-4 border-t border-black/5">
              <ColorPaletteSelector
                currentTheme={themeColor}
                onSelectTheme={handleSelectTheme}
              />
            </div>
          </header>

          {/* Conteúdo Central da Aplicação */}
          <main className="w-full max-w-xl mx-auto flex flex-col items-center px-4 py-2 sm:py-4 flex-1">

          {/* Dica da Sentinela: Protocolo de Presença exibido por 5 segundos ao entrar */}
          {showPresenceProtocol && (
            <div className={`w-full mt-4 px-4 py-2.5 ${currentThemeConfig.cardBg} border ${currentThemeConfig.border} shadow-sm rounded-xl flex items-center gap-2.5 text-xs text-slate-800 transition-all duration-500 ease-in-out ${presenceFading ? 'opacity-0 -translate-y-2 max-h-0 py-0 my-0 overflow-hidden' : 'opacity-100 max-h-24'}`}>
              <Icons.Volume2 className={`w-4 h-4 ${currentThemeConfig.cardIcon} shrink-0`} />
              <span>
                <strong>Protocolo de Presença:</strong> A saída desta aba durante o período de foco ativa o sinal sonoro ininterrupto até o retorno.
              </span>
            </div>
          )}

          {/* Área do Mascote */}
          <div className="flex flex-col items-center justify-center my-4 w-full">
            <div
              className={`relative z-30 px-5 py-3 mb-6 bg-[#FFFDF7] border-2 rounded-2xl text-center shadow-md max-w-sm ${visual.balloonAnim}`}
              style={{ borderColor: currentThemeConfig.borderColor }}
            >
              <p className="text-sm sm:text-base font-bold text-slate-900">{mascotMessage}</p>
              <div
                className="absolute left-1/2 -bottom-2 -translate-x-1/2 w-4 h-4 bg-[#FFFDF7] border-r-2 border-b-2 rotate-45"
                style={{ borderColor: currentThemeConfig.borderColor }}
              ></div>
            </div>

            <div className="relative flex items-center justify-center">
              {/* Confetes, Brilhinhos e Estrelinhas ao finalizar o tempo */}
              {mascotMood === 'comemorando' && <CelebrationParticles />}

              <div 
                onClick={() => sound.playClick()}
                className={`relative z-10 w-40 h-40 rounded-3xl flex flex-col items-center justify-center ${visual.bg} ${visual.anim} ring-8 ${visual.ring} ${visual.border || 'border-4 border-amber-900/80'} shadow-2xl cursor-pointer select-none transition-colors duration-500 ${visual.isSleeping ? 'overflow-hidden' : ''}`}
              >
                {/* Floating Zzz contidos no canto superior direito do card */}
                {visual.isSleeping && (
                  <div className={`absolute top-2 right-2 w-14 h-14 overflow-hidden pointer-events-none select-none z-20 ${visual.eyesClass || 'text-amber-900'}`}>
                    <span className="inner-z1 text-xs select-none">z</span>
                    <span className="inner-z2 text-sm select-none">z</span>
                    <span className="inner-z3 text-base select-none">Z</span>
                  </div>
                )}

                {visual.isBoxing ? (
                  <div className="flex items-center justify-center font-['Arial',sans-serif] font-black text-white text-3xl drop-shadow-md select-none tracking-normal">
                    <span className="text-white select-none mr-2">(</span>
                    <span className="inline-block animate-punch-left origin-center text-amber-100 will-change-transform">
                      {visual.armLeft}
                    </span>
                    <span className="inline-block select-none px-2 font-['Arial',sans-serif]">
                      {visual.faceCenter}
                    </span>
                    <span className="text-white select-none mr-1.5">)</span>
                    <span className="inline-block animate-punch-right origin-center text-amber-100 will-change-transform">
                      {visual.armRight}
                    </span>
                  </div>
                ) : visual.isWinking ? (
                  <div className="flex items-center justify-center font-['Arial',sans-serif] font-black text-sky-950 text-2xl sm:text-3xl tracking-normal select-none drop-shadow-sm">
                    <span className="select-none">(。</span>
                    
                    {/* Olho Esquerdo (Abre e pisca sutil) */}
                    <span className="inline-block relative w-[1.1ch] h-[1.2em] overflow-visible text-center align-middle">
                      <span className="anim-l-open inline-block absolute inset-0 text-center">•̀</span>
                      <span className="anim-l-closed inline-block absolute inset-0 text-center text-2xl sm:text-3xl leading-tight font-black">-</span>
                    </span>

                    <span className="select-none mx-0.5">ᴗ</span>

                    {/* Olho Direito (Piscadinha charmosa de comemoração) */}
                    <span className="inline-block relative w-[1.1ch] h-[1.2em] overflow-visible text-center align-middle">
                      <span className="anim-r-open inline-block absolute inset-0 text-center">•̀</span>
                      <span className="anim-r-closed inline-block absolute inset-0 text-center text-2xl sm:text-3xl leading-tight font-black">-</span>
                    </span>

                    <span className="select-none">)</span>

                    {/* Estrelinha que brilha intensamente na piscadinha */}
                    <span className="anim-sparkle inline-block origin-center ml-0.5 text-sky-800 will-change-transform">✧</span>
                  </div>
                ) : visual.isSleeping ? (
                  /* Rosto adormecido com fiozinho no nariz e boca mais para baixo */
                  <div className={`relative flex items-center justify-center font-black font-['Arial',sans-serif] drop-shadow-sm text-3xl tracking-normal select-none ${visual.eyesClass || 'text-amber-950'}`}>
                    <span>(¯</span>
                    <span className="relative inline-block mx-0.5 translate-y-2">
                      <span className={`inline-block ${visual.mouthClass || 'text-amber-900'}`}>﹃</span>
                    </span>
                    <span>¯)</span>
                  </div>
                ) : (
                  <span className={`font-black font-['Arial',sans-serif] drop-shadow-sm ${visual.eyesClass || 'text-4xl tracking-widest text-white'}`}>
                    {visual.eyes}
                  </span>
                )}
                {!visual.isSleeping && visual.mouth && (
                  <span className={`font-black mt-1 ${visual.mouthClass || 'text-2xl text-slate-950'}`}>
                    {visual.mouth}
                  </span>
                )}
              </div>
            </div>

            {distractionStrikes > 0 && (
              <span className="mt-3 px-3 py-1 bg-red-100 border border-red-400/60 text-red-700 text-xs font-semibold uppercase rounded-full flex items-center gap-1.5 shadow-sm">
                <Icons.AlertTriangle className="w-3.5 h-3.5 text-red-600" />
                {distractionStrikes} {distractionStrikes === 1 ? 'interrupção registrada' : 'interrupções registradas'}
              </span>
            )}
          </div>

          {/* Cronômetro Circular com Animação Orbital do Personagem */}
          <div className="relative flex items-center justify-center w-60 h-60 my-2">
            <TimerOrbitAnimation
              orbitAnimState={orbitAnimState}
              isActive={isActive}
              isPaused={isPaused}
              settings={orbitSettings}
            />
            <svg className="w-full h-full -rotate-90" viewBox="0 0 160 160">
              <circle cx="80" cy="80" r="70" className={currentThemeConfig.timerTrack} strokeWidth="10" fill="transparent" />
              <circle
                cx="80" cy="80" r="70"
                className={`transition-all duration-1000 ease-linear ${isActive ? currentThemeConfig.timerProgressActive : currentThemeConfig.timerProgressIdle}`}
                strokeWidth="10"
                strokeDasharray="440"
                strokeDashoffset={strokeDashoffset}
                strokeLinecap="round"
                fill="transparent"
              />
            </svg>
            <div className="absolute flex flex-col items-center justify-center">
              <span className="text-3xl sm:text-3xl font-mono font-black text-slate-900 tracking-normal">
                {formatTime(timeLeft)}
              </span>
              <span className={`text-xs font-semibold uppercase tracking-wider mt-1 ${currentThemeConfig.footerText}`}>
                {isActive ? 'Sessão em Andamento' : (isPaused && timeLeft > 0 ? 'Sessão Interrompida' : 'Pronto para Ativar')}
              </span>
            </div>
          </div>

          {/* Botões de Ação com Ajuste de Horas, Minutos e Segundos */}
          <div className="w-full max-w-sm flex flex-col gap-3">
            {!isActive ? (
              <div className="flex flex-col gap-3">
                {/* Predefinições Rápidas */}
                <div className="grid grid-cols-4 gap-2">
                  {[
                    { label: '15 min', h: 0, m: 15, s: 0 },
                    { label: '25 min', h: 0, m: 25, s: 0 },
                    { label: '45 min', h: 0, m: 45, s: 0 },
                    { label: '1 hora', h: 1, m: 0, s: 0 }
                  ].map((p) => {
                    const totalSecs = (p.h * 3600) + (p.m * 60) + p.s;
                    const isSelected = timeLeft === totalSecs && !isActive && !isPaused;
                    return (
                      <button
                        key={p.label}
                        type="button"
                        onClick={() => selectPreset(p.h, p.m, p.s)}
                        className={`py-2 border rounded-xl font-bold text-xs transition-all ${
                          isSelected
                            ? currentThemeConfig.buttonActive
                            : currentThemeConfig.button
                        }`}
                      >
                        {p.label}
                      </button>
                    );
                  })}
                </div>

                {/* Painel de Ajuste Manual: Horas, Minutos e Segundos */}
                <div className={`${currentThemeConfig.cardBg} border ${currentThemeConfig.border} rounded-xl p-3 flex flex-col gap-2 shadow-sm`}>
                  <div className="flex items-center justify-between text-xs font-semibold">
                    <span className={`flex items-center gap-1.5 ${currentThemeConfig.footerText}`}>
                      <Icons.Target className={`w-3.5 h-3.5 ${currentThemeConfig.cardIcon}`} />
                      Ajuste manual de tempo:
                    </span>
                    <span className={`text-[11px] font-mono font-bold ${currentThemeConfig.cardIcon}`}>
                      {formatTime(timeLeft)}
                    </span>
                  </div>
                  <div className="grid grid-cols-3 gap-2">
                    <div className={`flex flex-col items-center ${currentThemeConfig.inputBg} border ${currentThemeConfig.inputBorder} rounded-lg p-1.5 transition-colors`}>
                      <label className={`text-[10px] uppercase font-mono font-bold mb-0.5 ${currentThemeConfig.inputText}`}>Horas</label>
                      <input
                        type="number"
                        min="0"
                        max="23"
                        value={customHours}
                        onChange={(e) => updateTimeField(e.target.value, customMinutes, customSeconds)}
                        className={`w-full bg-transparent text-center font-mono font-black text-lg focus:outline-none ${currentThemeConfig.inputText}`}
                      />
                    </div>
                    <div className={`flex flex-col items-center ${currentThemeConfig.inputBg} border ${currentThemeConfig.inputBorder} rounded-lg p-1.5 transition-colors`}>
                      <label className={`text-[10px] uppercase font-mono font-bold mb-0.5 ${currentThemeConfig.inputText}`}>Minutos</label>
                      <input
                        type="number"
                        min="0"
                        max="59"
                        value={customMinutes}
                        onChange={(e) => updateTimeField(customHours, e.target.value, customSeconds)}
                        className={`w-full bg-transparent text-center font-mono font-black text-lg focus:outline-none ${currentThemeConfig.inputText}`}
                      />
                    </div>
                    <div className={`flex flex-col items-center ${currentThemeConfig.inputBg} border ${currentThemeConfig.inputBorder} rounded-lg p-1.5 transition-colors`}>
                      <label className={`text-[10px] uppercase font-mono font-bold mb-0.5 ${currentThemeConfig.inputText}`}>Segundos</label>
                      <input
                        type="number"
                        min="0"
                        max="59"
                        value={customSeconds}
                        onChange={(e) => updateTimeField(customHours, customMinutes, e.target.value)}
                        className={`w-full bg-transparent text-center font-mono font-black text-lg focus:outline-none ${currentThemeConfig.inputText}`}
                      />
                    </div>
                  </div>
                </div>

                {/* Botão para Zerar o Cronômetro */}
                <button
                  type="button"
                  onClick={resetTimer}
                  className={`w-full py-2.5 px-3 rounded-xl text-xs font-bold tracking-wider transition-all flex items-center justify-center gap-2 group shadow-sm cursor-pointer ${currentThemeConfig.button}`}
                >
                  <Icons.RotateCcw className={`w-3.5 h-3.5 ${currentThemeConfig.accentIcon} group-hover:rotate-180 transition-transform duration-300`} />
                  <span>ZERAR CRONÔMETRO</span>
                </button>

                {/* Botão Principal */}
                <button
                  onClick={handleStartCurrentSession}
                  className={`w-full py-4 rounded-xl text-base transition-all flex items-center justify-center gap-2 cursor-pointer ${currentThemeConfig.primaryButton}`}
                >
                  <Icons.Play className="w-4 h-4 fill-white" />
                  <span>{isPaused && timeLeft > 0 ? `RETOMAR SESSÃO (${formatTime(timeLeft)})` : `INICIAR SESSÃO (${formatTime(timeLeft)})`}</span>
                </button>
              </div>
            ) : (
              <button
                onClick={stopSession}
                className="w-full py-3.5 bg-red-600 hover:bg-red-500 active:scale-95 text-white font-bold rounded-xl text-sm shadow-lg shadow-red-600/30 transition-all uppercase tracking-wider flex items-center justify-center gap-2"
              >
                <Icons.StopCircle className="w-4 h-4" />
                <span>Interromper Sessão</span>
              </button>
            )}
          </div>

          {/* Restrições Cadastradas (Colapsável sob clique) */}
          <div className={`w-full max-w-md ${currentThemeConfig.cardBg} border ${currentThemeConfig.border} rounded-2xl shadow-sm mt-6 overflow-hidden transition-all duration-300`}>
            <button
              type="button"
              onClick={() => {
                sound.playClick();
                setIsRestrictionsOpen(prev => !prev);
              }}
              className="w-full p-4 flex justify-between items-center text-left hover:bg-slate-500/5 active:bg-slate-500/10 transition-colors cursor-pointer select-none"
            >
              <h3 className="text-xs font-black uppercase tracking-wider text-slate-900 flex items-center gap-1.5">
                <Icons.Ban className={`w-3.5 h-3.5 ${currentThemeConfig.cardIcon}`} />
                <span>Restrições Configuradas</span>
              </h3>
              <div className={`flex items-center gap-1 ${currentThemeConfig.footerText}`}>
                <Icons.ChevronDown className={`w-4 h-4 transition-transform duration-300 ${isRestrictionsOpen ? 'rotate-180' : ''}`} />
              </div>
            </button>

            {isRestrictionsOpen && (
              <div className={`px-4 pb-4 pt-1 border-t ${currentThemeConfig.border}`}>
                <div className="flex flex-wrap gap-2 mb-3 mt-2">
                  {distractionsList.map((d) => (
                    <span key={d} className={`inline-flex items-center gap-1.5 px-2.5 py-1 ${currentThemeConfig.inputBg} ${currentThemeConfig.inputText} border ${currentThemeConfig.inputBorder} rounded-lg text-xs font-semibold`}>
                      <span className="w-1.5 h-1.5 rounded-full bg-red-500"></span>
                      {d}
                      {!isActive && (
                        <button onClick={() => removeDistraction(d)} className="hover:text-red-600 ml-1 text-xs" title="Remover">×</button>
                      )}
                    </span>
                  ))}
                  {distractionsList.length === 0 && (
                    <p className={`text-xs italic ${currentThemeConfig.footerText}`}>Nenhuma restrição configurada.</p>
                  )}
                </div>
                {!isActive ? (
                  <form onSubmit={addDistraction} className="flex gap-2">
                    <input
                      type="text"
                      value={newDistraction}
                      onChange={(e) => setNewDistraction(e.target.value)}
                      placeholder="Adicionar restrição (ex: Rede Social, Notícias)..."
                      className={`flex-1 px-3 py-2 bg-white border ${currentThemeConfig.inputBorder} rounded-lg text-xs text-slate-900 focus:outline-none shadow-inner`}
                    />
                    <button type="submit" className={`px-3 py-2 rounded-lg text-xs font-bold transition-colors cursor-pointer ${currentThemeConfig.button}`}>
                      Adicionar
                    </button>
                  </form>
                ) : (
                  <p className={`text-[11px] italic text-center mt-2 ${currentThemeConfig.footerText}`}>
                    Lista bloqueada para edição durante a sessão ativa.
                  </p>
                )}
              </div>
            )}
          </div>

          {/* Modal de Bloqueio e Validação de Retorno */}
          {isPenalized && (
            <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-md flex items-center justify-center p-4">
              <div className="bg-[#FFFDF7] border-2 border-red-500/80 rounded-2xl max-w-lg w-full p-6 text-center shadow-2xl">
                <div className="w-14 h-14 bg-red-100 border-2 border-red-400 rounded-2xl mx-auto flex items-center justify-center text-red-600 mb-3 shadow-md">
                  <Icons.ShieldAlert className="w-7 h-7" />
                </div>
                <h2 className="text-xl sm:text-2xl font-black text-red-600 uppercase tracking-tight">
                  Sessão Interrompida
                </h2>
                <p className="text-xs text-slate-700 mt-1">
                  Evasão de tela detectada ({distractionStrikes}ª ocorrência). Conclua a validação para retomar o cronômetro:
                </p>

                <div className="my-4 p-3 bg-amber-50 border border-amber-200 rounded-xl">
                  <span className="text-xs uppercase text-amber-900/70 font-bold block mb-1">Período de estabilização forçado:</span>
                  <span className="text-2xl font-mono font-black text-amber-600 flex items-center justify-center gap-1.5">
                    {penaltyTimer > 0 ? (
                      <span>{penaltyTimer}s restantes</span>
                    ) : (
                      <span className="text-amber-700 flex items-center gap-1 font-black">
                        <Icons.Check className="w-5 h-5 text-amber-600 stroke-[3]" />
                        Tempo cumprido
                      </span>
                    )}
                  </span>
                </div>

                <div className="text-left my-4">
                  <div className="mb-1">
                    <label className="text-xs text-slate-700 font-bold block">
                      Digite a frase de compromisso abaixo:
                    </label>
                  </div>

                  {/* CAIXA DE TEXTO BLINDADA CONTRA CÓPIA */}
                  <div
                    onCopy={(e) => { e.preventDefault(); sound.playBuzzer(); setCheatAttempt(true); }}
                    onCut={(e) => e.preventDefault()}
                    onContextMenu={(e) => e.preventDefault()}
                    onMouseDown={(e) => e.preventDefault()}
                    onDragStart={(e) => e.preventDefault()}
                    style={{
                      userSelect: 'none',
                      WebkitUserSelect: 'none',
                      MozUserSelect: 'none',
                      msUserSelect: 'none'
                    }}
                    className="p-3 bg-red-50 border border-red-200 rounded-xl text-xs sm:text-sm font-semibold text-red-700 select-none cursor-not-allowed mb-2 font-mono tracking-wide shadow-inner text-center"
                  >
                    "{penaltyChallenge}"
                  </div>

                  {/* CAMPO DE DIGITAÇÃO COM TRAVA DE CTRL+V */}
                  <input
                    type="text"
                    value={typedPenalty}
                    onChange={(e) => setTypedPenalty(e.target.value)}
                    onPaste={(e) => {
                      e.preventDefault();
                      sound.playBuzzer();
                      setCheatAttempt(true);
                      setTimeout(() => setCheatAttempt(false), 3000);
                    }}
                    onDrop={(e) => {
                      e.preventDefault();
                      sound.playBuzzer();
                    }}
                    autoComplete="off"
                    autoCorrect="off"
                    autoCapitalize="off"
                    spellCheck="false"
                    placeholder="Digite a frase aqui para validar o retorno..."
                    className="w-full px-3 py-2.5 bg-white border border-amber-300 focus:border-red-500 focus:ring-1 focus:ring-red-500 rounded-xl text-slate-900 placeholder-amber-800/40 focus:outline-none text-xs font-mono transition-all"
                  />

                  {cheatAttempt && (
                    <div className="mt-2 p-2 bg-red-50 border border-red-500 rounded-lg text-center animate-shake flex items-center justify-center gap-2">
                      <Icons.ShieldAlert className="w-4 h-4 text-red-600 shrink-0" />
                      <p className="text-xs text-red-700 font-semibold">
                        Ação bloqueada: a colagem de texto não é permitida. Digite a frase manualmente.
                      </p>
                    </div>
                  )}
                </div>

                <button
                  onClick={resolvePenalty}
                  disabled={!canUnlockPenalty}
                  className={`w-full py-3 rounded-xl font-black text-sm transition-all ${
                    canUnlockPenalty
                      ? 'bg-amber-600 hover:bg-amber-500 text-white shadow-lg shadow-amber-600/30 cursor-pointer active:scale-95'
                      : 'bg-amber-100 text-amber-800/50 cursor-not-allowed border border-amber-200'
                  }`}
                >
                  {penaltyTimer > 0
                    ? `AGUARDE ${penaltyTimer}S...`
                    : typedPenalty.trim().toLowerCase() !== penaltyChallenge.trim().toLowerCase()
                    ? 'DIGITE A FRASE COMPLETA'
                    : 'RETOMAR SESSÃO DE FOCO'}
                </button>
              </div>
            </div>
          )}

          </main>

          {/* Modal de Configurações da Animação Orbital (opal.html) */}
          <OrbitSettingsModal
            isOpen={showOrbitModal}
            onClose={() => setShowOrbitModal(false)}
            settings={orbitSettings}
            onUpdateSettings={handleUpdateOrbitSettings}
            onTriggerTestSequence={triggerOrbitTestSequence}
          />

          <footer
            className={`w-full text-center border-t pt-4 text-[11px] mt-6 font-medium transition-colors ${currentThemeConfig.footerText}`}
            style={{ borderColor: currentThemeConfig.borderColor }}
          >
            Sessão monitorada por presença de aba. Continuidade garante o resultado.
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
